<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ezra.Ai - AI Chat & Image Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass-panel {
      background: rgba(18, 18, 26, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .custom-scrollbar::-webkit-scrollbar { width: 5px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #2d2d3f; border-radius: 10px; }
  </style>
</head>
<body class="bg-[#0b0b10] text-gray-100 h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="h-16 border-b border-gray-800/60 flex items-center justify-between px-4 sm:px-6 bg-[#0f0f17]">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center shadow-lg shadow-purple-500/20">
        <i class="fa-solid fa-sparkles text-white text-base"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg tracking-tight bg-gradient-to-r from-white via-gray-200 to-purple-400 bg-clip-text text-transparent">ezra.Ai</h1>
        <span class="text-[10px] text-purple-400 font-medium tracking-wider uppercase">Studio Edition</span>
      </div>
    </div>

    <!-- Mode Toggle -->
    <div class="flex bg-gray-900/90 p-1 rounded-xl border border-gray-800">
      <button id="btn-chat-mode" onclick="switchMode('chat')" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 bg-purple-600 text-white shadow">
        <i class="fa-solid fa-message text-[11px]"></i> Chat
      </button>
      <button id="btn-image-mode" onclick="switchMode('image')" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 text-gray-400 hover:text-white">
        <i class="fa-solid fa-wand-magic-sparkles text-[11px]"></i> Image
      </button>
    </div>

    <!-- Settings Button -->
    <button onclick="toggleModal(true)" class="w-9 h-9 rounded-xl bg-gray-800/80 hover:bg-gray-700 flex items-center justify-center text-gray-300 hover:text-white transition">
      <i class="fa-solid fa-gear text-sm"></i>
    </button>
  </header>

  <!-- Main Container -->
  <main class="flex-1 flex overflow-hidden relative">
    
    <!-- Chat / Output Area -->
    <div class="flex-1 flex flex-col h-full bg-[#0b0b10] relative">
      <div id="message-container" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4 custom-scrollbar">
        <!-- Welcome Banner -->
        <div class="max-w-xl mx-auto my-8 p-6 rounded-2xl glass-panel text-center border border-purple-500/20">
          <div class="w-14 h-14 bg-purple-500/10 border border-purple-500/30 rounded-2xl flex items-center justify-center mx-auto mb-4 text-purple-400 text-2xl">
            <i class="fa-solid fa-robot"></i>
          </div>
          <h2 class="text-xl font-bold text-white mb-2">Welcome to ezra.Ai</h2>
          <p class="text-xs text-gray-400 leading-relaxed">
            Your personal assistant for intelligent text chat and AI image creation. Switch modes using the top toggle or upload an image to analyze.
          </p>
        </div>
      </div>

      <!-- Attachment Preview Box -->
      <div id="attachment-preview" class="hidden px-6 py-2 bg-[#12121c] border-t border-gray-800 flex items-center gap-3">
        <div class="relative group">
          <img id="preview-img" src="" class="w-12 h-12 object-cover rounded-lg border border-purple-500/50" />
          <button onclick="clearAttachment()" class="absolute -top-2 -right-2 w-5 h-5 bg-red-500 text-white rounded-full text-xs flex items-center justify-center shadow">
            &times;
          </button>
        </div>
        <span class="text-xs text-gray-400 italic" id="preview-text">Image attached</span>
      </div>

      <!-- Input Bar -->
      <div class="p-4 bg-[#0f0f17] border-t border-gray-800/60">
        <div class="max-w-4xl mx-auto flex items-center gap-2 glass-panel p-2 rounded-2xl border border-gray-800 focus-within:border-purple-500/50 transition-all">
          
          <!-- Plus (+) Button for Uploads -->
          <label class="w-10 h-10 rounded-xl bg-gray-800/80 hover:bg-gray-700/80 flex items-center justify-center text-gray-300 hover:text-white cursor-pointer transition shrink-0" title="Attach Image">
            <i class="fa-solid fa-plus text-base"></i>
            <input type="file" id="file-input" accept="image/*" class="hidden" onchange="handleFileSelect(event)" />
          </label>

          <!-- Text Prompt Input -->
          <input type="text" id="user-input" placeholder="Ask Ezra anything or describe an image..." class="flex-1 bg-transparent px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none" onkeydown="if(event.key==='Enter') handleSend()" />

          <!-- Send Button -->
          <button onclick="handleSend()" class="w-10 h-10 rounded-xl bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 flex items-center justify-center text-white shadow-lg shadow-purple-600/30 transition shrink-0">
            <i class="fa-solid fa-paper-plane text-xs"></i>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Settings Modal -->
  <div id="settings-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="glass-panel w-full max-w-md p-6 rounded-2xl border border-gray-800 space-y-4">
      <div class="flex items-center justify-between border-b border-gray-800 pb-3">
        <h3 class="font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-gear text-purple-400"></i> Settings
        </h3>
        <button onclick="toggleModal(false)" class="text-gray-400 hover:text-white">&times;</button>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-300 mb-1">Gemini API Key</label>
        <input type="password" id="api-key-input" placeholder="Paste AI Studio Key here..." class="w-full bg-gray-900 border border-gray-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-purple-500" />
        <p class="text-[11px] text-gray-500 mt-1">Get your free API key at <a href="https://aistudio.google.com" target="_blank" class="text-purple-400 underline">aistudio.google.com</a></p>
      </div>
      <button onclick="saveApiKey()" class="w-full py-2.5 bg-purple-600 hover:bg-purple-500 text-white font-semibold text-xs rounded-xl shadow transition">
        Save API Key
      </button>
    </div>
  </div>

  <script>
    let activeMode = 'chat';
    let attachedImageData = null;

    function switchMode(mode) {
      activeMode = mode;
      const chatBtn = document.getElementById('btn-chat-mode');
      const imgBtn = document.getElementById('btn-image-mode');
      const input = document.getElementById('user-input');

      if (mode === 'chat') {
        chatBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 bg-purple-600 text-white shadow";
        imgBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 text-gray-400 hover:text-white";
        input.placeholder = "Ask Ezra anything...";
      } else {
        imgBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 bg-purple-600 text-white shadow";
        chatBtn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold transition-all flex items-center gap-1.5 text-gray-400 hover:text-white";
        input.placeholder = "Describe the image you want to generate...";
      }
    }

    function toggleModal(show) {
      document.getElementById('settings-modal').classList.toggle('hidden', !show);
      if (show) {
        document.getElementById('api-key-input').value = localStorage.getItem('gemini_api_key') || '';
      }
    }

    function saveApiKey() {
      const key = document.getElementById('api-key-input').value.trim();
      localStorage.setItem('gemini_api_key', key);
      toggleModal(false);
      alert('API key saved successfully!');
    }

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        attachedImageData = evt.target.result;
        document.getElementById('preview-img').src = attachedImageData;
        document.getElementById('attachment-preview').classList.remove('hidden');
      };
      reader.readAsDataURL(file);
    }

    function clearAttachment() {
      attachedImageData = null;
      document.getElementById('file-input').value = '';
      document.getElementById('attachment-preview').classList.add('hidden');
    }

    function appendMessage(sender, text, imgUrl = null) {
      const container = document.getElementById('message-container');
      const isUser = sender === 'user';
      
      const msgDiv = document.createElement('div');
      msgDiv.className = `flex gap-3 max-w-2xl ${isUser ? 'ml-auto flex-row-reverse' : ''}`;
      
      let avatar = isUser 
        ? `<div class="w-8 h-8 rounded-xl bg-gray-700 flex items-center justify-center text-xs text-white shrink-0"><i class="fa-solid fa-user"></i></div>`
        : `<div class="w-8 h-8 rounded-xl bg-purple-600 flex items-center justify-center text-xs text-white shrink-0"><i class="fa-solid fa-robot"></i></div>`;

      let imgHTML = imgUrl ? `<img src="${imgUrl}" class="rounded-xl max-w-full h-auto mb-2 border border-gray-700" />` : '';

      msgDiv.innerHTML = `
        ${avatar}
        <div class="p-3.5 rounded-2xl text-xs leading-relaxed ${isUser ? 'bg-purple-600 text-white rounded-tr-none' : 'glass-panel text-gray-200 rounded-tl-none border border-gray-800'}">
          ${imgHTML}
          <div>${text}</div>
        </div>
      `;

      container.appendChild(msgDiv);
      container.scrollTop = container.scrollHeight;
    }

    async function handleSend() {
      const input = document.getElementById('user-input');
      const text = input.value.trim();
      if (!text && !attachedImageData) return;

      const userText = text || (attachedImageData ? "Analyzed image" : "");
      appendMessage('user', userText, attachedImageData);
      
      const tempImg = attachedImageData;
      input.value = '';
      clearAttachment();

      const apiKey = localStorage.getItem('gemini_api_key');

      if (!apiKey) {
        appendMessage('ezra', '⚠️ Please set your Gemini API Key in Settings (⚙️) to enable Ezra responses.');
        return;
      }

      appendMessage('ezra', 'Thinking...');

      try {
        if (activeMode === 'chat') {
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: userText }] }]
            })
          });
          const data = await response.json();
          const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Sorry, I couldn't generate a response.";
          
          const container = document.getElementById('message-container');
          container.removeChild(container.lastChild);

          appendMessage('ezra', reply);
        } else {
          const container = document.getElementById('message-container');
          container.removeChild(container.lastChild);
          appendMessage('ezra', `🎨 Image generation request received for: "${userText}".`);
        }
      } catch (err) {
        const container = document.getElementById('message-container');
        container.removeChild(container.lastChild);
        appendMessage('ezra', '❌ Error connecting to AI service. Please check your API key.');
      }
    }
  </script>
</body>
</html>
